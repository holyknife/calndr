name: Scheduled Calendar Scraping

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to scrape (optional, defaults to current and next BS year)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Refresh calendar data
        env:
          MANUAL_YEAR: ${{ github.event.inputs.year }}
        run: |
          set -e

          refresh_year() {
            YEAR="$1"
            TMP="$(mktemp -d)"
            echo "Scraping $YEAR into a temporary folder"
            if DATA_DIR="$TMP" uv run python -- scraper.py "$YEAR" --single json --dir format \
              && jq -e 'length == 12 and all(.[]; ([.days[] | select(.n != "")] | length) as $c | $c >= 29 and $c <= 32)' "$TMP/$YEAR.json" > /dev/null; then
              rm -rf "data/$YEAR"
              mkdir -p data
              cp -r "$TMP/$YEAR" "data/$YEAR"
              cp "$TMP/$YEAR.json" "data/$YEAR.json"
              echo "Refreshed $YEAR"
            else
              echo "Skipping $YEAR: scrape failed or data looked wrong. Old files kept."
            fi
          }

          if [ -n "$MANUAL_YEAR" ]; then
            refresh_year "$MANUAL_YEAR"
          else
            AD_YEAR=$(date +%Y)
            AD_MONTH=$(date +%-m)
            AD_DAY=$(date +%-d)

            BS_YEAR=$((AD_YEAR + 56))
            if [ "$AD_MONTH" -gt 4 ] || { [ "$AD_MONTH" -eq 4 ] && [ "$AD_DAY" -ge 14 ]; }; then
              BS_YEAR=$((BS_YEAR + 1))
            fi
            echo "Current Nepali year (approx): $BS_YEAR"

            refresh_year "$BS_YEAR"
            refresh_year "$((BS_YEAR + 1))"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automated update of Nepali calendar data"
          git pull --rebase origin main
          git push origin HEAD:main
