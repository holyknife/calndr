name: Scheduled Calendar Scraping

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to scrape (optional, defaults to current and next BS year)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install aiohttp orjson beautifulsoup4

      - name: Refresh calendar data
        env:
          MANUAL_YEAR: ${{ github.event.inputs.year }}
        run: |
          set -e
          FAILED=0

          refresh_year() {
            YEAR="$1"
            TMP="$(mktemp -d)"
            echo "Scraping $YEAR into a temporary folder"
            if DATA_DIR="$TMP" python scraper.py "$YEAR" --single json --dir format; then
              if jq -e 'length == 12 and all(.[]; ([.days[] | select(.n != "")] | length) as $c | $c >= 29 and $c <= 32)' "$TMP/$YEAR.json" > /dev/null; then
                rm -rf "data/$YEAR"
                mkdir -p data
                cp -r "$TMP/$YEAR" "data/$YEAR"
                cp "$TMP/$YEAR.json" "data/$YEAR.json"
                echo "Refreshed $YEAR"
                return 0
              fi
              echo "Data check failed for $YEAR. Day counts per month:"
              jq -c 'map_values([.days[] | select(.n != "")] | length)' "$TMP/$YEAR.json" || true
            fi
            echo "Skipping $YEAR: scrape failed or data looked wrong. Old files kept."
            return 1
          }

          if [ -n "$MANUAL_YEAR" ]; then
            refresh_year "$MANUAL_YEAR" || FAILED=1
          else
            AD_YEAR=$(date +%Y)
            AD_MONTH=$(date +%-m)
            AD_DAY=$(date +%-d)

            BS_YEAR=$((AD_YEAR + 56))
            if [ "$AD_MONTH" -gt 4 ] || { [ "$AD_MONTH" -eq 4 ] && [ "$AD_DAY" -ge 14 ]; }; then
              BS_YEAR=$((BS_YEAR + 1))
            fi
            echo "Current Nepali year (approx): $BS_YEAR"

            refresh_year "$BS_YEAR" || FAILED=1
            refresh_year "$((BS_YEAR + 1))" || true
          fi

          exit $FAILED

      - name: Commit and push changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automated update of Nepali calendar data"
          git pull --rebase origin main
          git push origin HEAD:main
