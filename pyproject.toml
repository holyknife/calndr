[project]
name = "nepali-calendar-api"
version = "0.2.0"
description = "A Nepali calendar dataset/library containing Nepali dates, tithi, festivals, public holidays, and auspicious dates for marriage and bratabandha ceremonies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
scraper = [
    "aiohttp>=3.13.3",
    "beautifulsoup4>=4.14.3",
]
dev = [
    "ruff>=0.14.6",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

authors = [
    { name = "Sankalp Tharu", email = "sankalptharu50028@gmail.com" },
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
